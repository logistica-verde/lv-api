spring.application.name=lv-api

spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=logistica_verde;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

optimizer.url=${OPTIMIZER_URL:http://localhost:8000}
optimizer.timeout=90s

besu.rpc.url=${BESU_RPC_URL:http://localhost:8545}
besu.chain-id=${BESU_CHAIN_ID:1337}
besu.contract-address=${BESU_CONTRACT_ADDRESS:}
besu.private-key=${BESU_PRIVATE_KEY:}
besu.gas-price=0
besu.gas-limit=300000

security.jwt.secret=${JWT_SECRET:}
security.jwt.expiration=${JWT_EXPIRATION:8h}
security.bootstrap-admin.email=${LV_ADMIN_EMAIL:}
security.bootstrap-admin.password=${LV_ADMIN_PASSWORD:}
security.bootstrap-admin.name=${LV_ADMIN_NAME:Administrador}

lv.geo.provider=${GEO_PROVIDER:database}
lv.osrm.url=${OSRM_URL:http://localhost:5000}
lv.elevation.url=${ELEVATION_URL:http://localhost:5001}
lv.elevation.dataset=${ELEVATION_DATASET:srtm30m}
